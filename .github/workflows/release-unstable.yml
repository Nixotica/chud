name: Release (unstable)

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Resolve version
        id: version
        run: |
          version=$(ls dist/*.whl | head -n1 | sed -E 's|.*/chud-([^-]+)-.*|\1|')
          short_sha=$(git rev-parse --short=7 "${{ github.event.workflow_run.head_sha }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=unstable-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "chud ${{ steps.version.outputs.version }} (unstable)"
          prerelease: true
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: dist/*
          body: |
            Automated unstable build from `${{ github.event.workflow_run.head_branch }}` @ `${{ github.event.workflow_run.head_sha }}`.

            Install:
            ```
            pip install https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/chud-${{ steps.version.outputs.version }}-py3-none-any.whl
            ```
