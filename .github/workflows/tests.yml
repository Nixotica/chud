name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install dependencies
        run: nix develop --command bash -c "uv venv .venv --python 3.12 && uv pip sync --python .venv/bin/python requirements.lock && uv pip install --python .venv/bin/python -e . --no-deps"

      - name: Run tests
        run: nix develop --command .venv/bin/pytest

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Ruff lint
        run: nix develop --command ruff check .

      - name: Ruff format check
        run: nix develop --command ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install dependencies
        run: nix develop --command bash -c "uv venv .venv --python 3.12 && uv pip sync --python .venv/bin/python requirements.lock && uv pip install --python .venv/bin/python -e . --no-deps"

      - name: Pyright
        run: nix develop --command bash -c "source .venv/bin/activate && pyright"

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build chud package
        run: nix build .#default

      - name: Smoke test built binary
        run: ./result/bin/chud --version
