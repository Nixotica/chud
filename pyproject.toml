[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "chud"
dynamic = ["version"]
description = "TUI for orchestrating multiple Claude Code agents in parallel."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nixotica" }]
license = { text = "MIT" }
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "textual>=8.2.4",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.5",
  "pyright>=1.1.350",
]

[project.scripts]
chud = "chud.app:main"

[project.urls]
Repository = "https://github.com/Nixotica/chud"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Writes the resolved version into the package at build time so importlib.metadata
# and __version__ both report the same string.
version-file = "src/chud/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chud"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
