[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chud"
version = "0.0.1"
description = "TUI for orchestrating multiple Claude Code agents in parallel."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nixotica" }]
license = { text = "MIT" }
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "textual>=0.80",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
chud = "chud.app:main"

[project.urls]
Repository = "https://github.com/Nixotica/chud"

[tool.hatch.build.targets.wheel]
packages = ["src/chud"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
